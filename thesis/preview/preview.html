<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STERA thesis</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/stex/stex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root { --bg:#e9ebee; --bar:#fff; --fg:#1d2733; --muted:#5b6673; --ok:#2e7d4f; --err:#b3261e; --acc:#1f6f8b; --warn:#b26a00; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--fg);
         font:14px -apple-system,system-ui,sans-serif; }
  #bar { display:flex; gap:10px; align-items:center; padding:7px 14px; background:var(--bar); border-bottom:1px solid #d3d7dc; flex-wrap:wrap; }
  #bar b { font-size:15px; }
  #stato { font-weight:600; } #stato.ok { color:var(--ok); } #stato.error { color:var(--err); } #stato.compiling { color:var(--warn); }
  #info, #nomefile { color:var(--muted); }
  #nomefile.sporco::after { content:" · unsaved"; color:var(--warn); font-weight:600; }
  .dx { margin-left:auto; display:flex; gap:6px; align-items:center; }
  button { border:1px solid #c4c9cf; background:#fff; color:var(--fg); border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; }
  button.prim { background:var(--acc); color:#fff; border-color:var(--acc); }
  #avviso { display:none; background:#fff4e0; color:#6b4000; padding:6px 14px; border-bottom:1px solid #f0d9a8; }
  #avviso button { margin-left:8px; }
  #main { flex:1; display:flex; min-height:0; }
  #files { width:220px; overflow:auto; background:var(--bar); border-right:1px solid #d3d7dc; padding:6px 0; flex:none; }
  #files div { padding:4px 12px; cursor:pointer; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #files div:hover { background:#0000000d; } #files div.sel { background:var(--acc); color:#fff; }
  #files .nuovo::after { content:" ●"; color:#e08a3c; }
  #ed { flex:1; min-width:0; display:flex; }
  .CodeMirror { flex:1; height:100%; font:13px/1.55 ui-monospace,Menlo,monospace; }
  .cm-claude { background:#ffe8c7; }
  .cm-sync { background:#cfe6f0; transition:background .3s; }
  #div { width:6px; cursor:col-resize; background:#d3d7dc; flex:none; }
  #pdf { flex:1; overflow:auto; min-width:0; }
  #log { white-space:pre-wrap; color:var(--err); font:12px ui-monospace,monospace; padding:0 14px; }
  #pagine { display:flex; flex-direction:column; align-items:center; gap:12px; padding:14px; }
  .pag { position:relative; line-height:0; } .pag a:hover { background:#1f6f8b22; }
  canvas { background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.25); max-width:100%; height:auto; }
</style>
</head>
<body>
<div id="bar">
  <b>STERA thesis</b><span id="nomefile"></span>
  <span class="dx">
    <button id="salva" title="Cmd+S">Save</button>
    <button id="compila" class="prim" title="Cmd+Enter">Compile</button>
    <span id="stato">starting…</span><span id="info"></span>
    <button id="meno">−</button><span id="z">100%</span><button id="piu">+</button>
  </span>
</div>
<div id="avviso">The file was changed on disk (for example by Claude) while you had unsaved changes.
  <button id="ricarica">Load the version on disk</button><button id="tieni">Keep my changes</button></div>
<div id="main">
  <div id="files"></div>
  <div id="ed"></div>
  <div id="div"></div>
  <div id="pdf"><div id="log"></div><div id="pagine"></div></div>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $ = id => document.getElementById(id);
const cm = CodeMirror($("ed"), { mode: "stex", lineNumbers: true, lineWrapping: true });
let sel = null, salvato = "", tempoFile = 0, tempi = {}, versione = -1, scala = 1, rendering = false, doc = null, oss = null, segni = [];
try { sel = localStorage.getItem("sel"); } catch (e) {}

const sporco = () => cm.getValue() !== salvato;
cm.on("change", () => $("nomefile").classList.toggle("sporco", sporco()));

function evidenzia(vecchio, nuovo) {
  segni.forEach(s => s.clear()); segni = [];
  if (vecchio === null) return;
  const a = vecchio.split("\n"), b = nuovo.split("\n");
  let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
  let j = 0; while (j < a.length - i && j < b.length - i && a[a.length-1-j] === b[b.length-1-j]) j++;
  for (let k = i; k < b.length - j; k++) segni.push(cm.addLineClass(k, "background", "cm-claude"));
  if (b.length - j > i) cm.scrollIntoView({ line: i, ch: 0 }, 120);
}
async function apri(p, daDisco) {
  const r = await fetch("/sorgente?p=" + encodeURIComponent(p), { cache: "no-store" }), t = await r.text();
  const vecchio = (daDisco && p === sel) ? salvato : null, pos = cm.getScrollInfo();
  sel = p; try { localStorage.setItem("sel", p); } catch (e) {}
  salvato = t; tempoFile = tempi[p] || 0; cm.setValue(t); cm.clearHistory();
  if (vecchio !== null) { cm.scrollTo(pos.left, pos.top); evidenzia(vecchio, t); }
  $("nomefile").textContent = p; $("nomefile").classList.remove("sporco");
  [...$("files").children].forEach(d => d.classList.toggle("sel", d.dataset.p === p));
}
async function salva() {
  if (!sel || !sporco()) return;
  const r = await fetch("/salva?p=" + encodeURIComponent(sel), { method: "POST", body: cm.getValue() });
  if (!r.ok) { alert("Save failed"); return; }
  const j = await r.json(); salvato = cm.getValue(); tempi[sel] = tempoFile = j.t;
  $("nomefile").classList.remove("sporco"); segni.forEach(s => s.clear()); segni = [];
}
async function compila() { await salva(); await fetch("/compila", { method: "POST" }); }

async function elenco() {
  const e = await (await fetch("/elenco", { cache: "no-store" })).json(), ora = Date.now() / 1000;
  const lista = e.filter(f => f.p.endsWith(".tex") || f.p.endsWith(".bib"));
  $("files").replaceChildren(...lista.map(f => {
    const d = document.createElement("div"); d.textContent = f.p; d.dataset.p = f.p; d.title = f.p;
    if (ora - f.t < 600) d.classList.add("nuovo"); if (f.p === sel) d.classList.add("sel");
    d.onclick = async () => { if (sporco() && !confirm("You have unsaved changes in " + sel + ". Switch file without saving?")) return; apri(f.p); };
    return d; }));
  const prima = Object.keys(tempi).length === 0;
  let cambiati = [];
  for (const f of e) { if (tempi[f.p] && tempi[f.p] !== f.t) cambiati.push(f.p); tempi[f.p] = f.t; }
  if (prima) { if (!sel) sel = (lista.slice().sort((a, b) => b.t - a.t)[0] || {}).p; if (sel) apri(sel); return; }
  if (sel && cambiati.includes(sel) && tempi[sel] !== tempoFile) {
    if (sporco()) $("avviso").style.display = "block"; else apri(sel, true);
  } else if (cambiati.length && !sporco()) {
    const c = cambiati.find(p => p.endsWith(".tex")); if (c && c !== sel) { const v = salvato; await apri(c); }
  }
}
$("ricarica").onclick = () => { $("avviso").style.display = "none"; salvato = ""; apri(sel, true); };
$("tieni").onclick = () => { $("avviso").style.display = "none"; tempoFile = tempi[sel]; };

let rigaSegnata = null;
async function vaiAlCodice(pagina, x, y) {
  const r = await (await fetch(`/sincro?pagina=${pagina}&x=${x}&y=${y}`, { cache: "no-store" })).json();
  if (!r) return;
  if (r.p !== sel) { if (sporco() && !confirm("You have unsaved changes in " + sel + ". Switch file without saving?")) return; await apri(r.p); }
  const n = r.riga - 1; cm.setCursor({ line: n, ch: 0 }); cm.scrollIntoView({ line: n, ch: 0 }, 200); cm.focus();
  if (rigaSegnata !== null) cm.removeLineClass(rigaSegnata, "background", "cm-sync");
  rigaSegnata = n; cm.addLineClass(n, "background", "cm-sync");
  setTimeout(() => { if (rigaSegnata === n) { cm.removeLineClass(n, "background", "cm-sync"); rigaSegnata = null; } }, 2500);
}
async function vaiA(dest) {
  if (typeof dest === "string") dest = await doc.getDestination(dest);
  if (!dest) return;
  const idx = await doc.getPageIndex(dest[0]), w = $("pagine").children[idx];
  const page = await doc.getPage(idx + 1), vp = page.getViewport({ scale: 1 });
  let y = 0; if (dest[1] && dest[1].name === "XYZ" && dest[3] != null) y = (vp.height - dest[3]) / vp.height * w.offsetHeight;
  $("pdf").scrollTop = w.offsetTop + y - 20;
}
async function disegnaPagina(w) {
  if (w.dataset.fatto) return; w.dataset.fatto = 1;
  const c = w.firstChild, page = await doc.getPage(+w.dataset.n), vp = page.getViewport({ scale: scala * 1.5 });
  c.width = vp.width; c.height = vp.height;
  await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
  const base = page.getViewport({ scale: 1 });
  c.onclick = e => { const r = c.getBoundingClientRect();
    vaiAlCodice(+w.dataset.n, (e.clientX - r.left) / r.width * base.width, (e.clientY - r.top) / r.height * base.height); };
  c.style.cursor = "text";
  for (const a of await page.getAnnotations()) {
    if (a.subtype !== "Link" || (!a.dest && !a.url)) continue;
    const r = vp.convertToViewportRectangle(a.rect), l = document.createElement("a");
    const x = Math.min(r[0], r[2]) / 1.5, y = Math.min(r[1], r[3]) / 1.5;
    Object.assign(l.style, { position: "absolute", left: x + "px", top: y + "px",
      width: Math.abs(r[2] - r[0]) / 1.5 + "px", height: Math.abs(r[3] - r[1]) / 1.5 + "px", cursor: "pointer" });
    if (a.url) { l.href = a.url; l.target = "_blank"; } else l.onclick = e => { e.preventDefault(); vaiA(a.dest); };
    w.appendChild(l);
  }
}
async function disegna(v) {
  rendering = true; const pd = $("pdf"), y = pd.scrollTop, h = pd.scrollHeight || 1;
  doc = await pdfjsLib.getDocument({ url: "/main.pdf?v=" + v }).promise;
  const p1 = (await doc.getPage(1)).getViewport({ scale: scala * 1.5 });
  if (oss) oss.disconnect();
  oss = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) disegnaPagina(e.target); }), { root: pd, rootMargin: "800px" });
  const frag = document.createDocumentFragment();
  for (let i = 1; i <= doc.numPages; i++) {
    const w = document.createElement("div"), c = document.createElement("canvas");
    w.className = "pag"; w.dataset.n = i; c.width = p1.width; c.height = p1.height;
    c.style.width = (p1.width / 1.5) + "px"; w.appendChild(c); frag.appendChild(w); oss.observe(w);
  }
  $("pagine").replaceChildren(frag); pd.scrollTop = y / h * pd.scrollHeight;
  $("info").textContent = doc.numPages + " pages · " + new Date().toLocaleTimeString("en-GB");
  rendering = false;
}
async function controlla() {
  try {
    const s = await (await fetch("/stato", { cache: "no-store" })).json();
    $("stato").textContent = s.status; $("stato").className = s.status;
    $("log").textContent = s.status === "error" ? s.log : "";
    if (s.version && s.version !== versione && !rendering) { versione = s.version; disegna(versione); }
    await elenco();
  } catch (e) { $("stato").textContent = "server unreachable"; $("stato").className = "error"; }
}
function zoom(d) { scala = Math.max(.5, Math.min(2.5, scala + d)); $("z").textContent = Math.round(scala * 100) + "%"; if (versione > 0) disegna(versione); }
$("piu").onclick = () => zoom(.1); $("meno").onclick = () => zoom(-.1);
$("salva").onclick = salva; $("compila").onclick = compila;
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); salva(); }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); compila(); }
});
window.addEventListener("beforeunload", e => { if (sporco()) { e.preventDefault(); e.returnValue = ""; } });
$("div").onmousedown = () => { const m = ev => { $("ed").style.flex = "0 0 " + (ev.clientX - $("files").offsetWidth) + "px"; };
  document.addEventListener("mousemove", m); document.addEventListener("mouseup", () => document.removeEventListener("mousemove", m), { once: true }); };
setInterval(controlla, 1500); controlla();
</script>
</body>
</html>
